[package]
name = "subtask_manager"
version = "0.4.0"
edition = "2021"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
once_cell = "1.21.3"
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
pyo3 = { version = "0.22.4", features = ["extension-module", "abi3-py39"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
# `visitor` gives us visit_relations() for uniform table extraction.
sqlparser = { version = "0.62.0", features = ["visitor"] }
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
walkdir = "2.5.0"

[profile.release]
# The SQL parser brings a lot of symbols; stripping keeps the published wheel
# small without affecting behaviour.
strip = "symbols"
lto = "thin"
